<title>Mein Aktenschrank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#ECEFF1; --surface:#F8F9FA; --surface-2:#E1E6EA;
  --ink:#17212B; --ink-2:#44525F; --ink-3:#5C6A77; --line:#CBD3DA;
  --accent:#24598C; --accent-ink:#FFFFFF; --accent-soft:#DCE8F3;
  --stamp:#A63A2B; --warn:#8A4B00; --warn-bg:#FBEBD0; --ok:#2B6644; --ok-bg:#DDEFE3;
  --paper:#FFFFFF; --paper-line:#D5DCE2; --paper-ink:#44525F;
  --fold-s:42%; --fold-l:46%; --fold-back-l:35%; --fold-ink:#FFFFFF;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#11171D;--surface:#19212A;--surface-2:#222C36;--ink:#E8EDF1;--ink-2:#B0BBC5;--ink-3:#8F9CA8;--line:#2D3945;--accent:#7FB4E8;--accent-ink:#0C1824;--accent-soft:#1E3247;--stamp:#E8907D;--warn:#F2C57C;--warn-bg:#3A2D14;--ok:#8FD0A6;--ok-bg:#1B3326;--paper:#E9EEF2;--paper-line:#C3CCD4;--paper-ink:#3A4753;--fold-s:38%;--fold-l:48%;--fold-back-l:34%;color-scheme:dark;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,p,ul{margin:0}
.wrap{max-width:1000px;margin-inline:auto;padding:18px 16px 72px;display:flex;flex-direction:column;gap:22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{flex:0 0 auto;display:block}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.09) rotate(-1.5deg)}70%{transform:scale(.98)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.enter>*{animation:rise .38s both;animation-delay:calc(min(var(--i,0),14)*28ms)}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand-ic{width:46px;height:46px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:0 0 auto}
h1{font:600 clamp(30px,7vw,40px)/1 var(--f-display);letter-spacing:.01em}
.stats{margin-top:4px;color:var(--ink-3);font:400 12.5px var(--f-mono)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 14px var(--f-body);cursor:pointer;transition:transform .12s,border-color .12s;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn.danger{color:var(--stamp);border-color:var(--stamp)}
.btn[disabled]{opacity:.45;cursor:default}
:is(.btn,.fold,.pill,.tile-edit,input,select,textarea,a,.due-ok):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eingang{position:relative;border:2px dashed var(--line);border-radius:16px;background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:14px;transition:border-color .15s,background .15s}
.eingang.drag{border-color:var(--accent);background:var(--accent-soft)}
.stamp{position:absolute;top:-14px;right:14px;transform:rotate(-4deg);background:var(--bg);border:2px solid var(--stamp);outline:1px solid var(--stamp);outline-offset:2px;border-radius:3px;padding:2px 10px;color:var(--stamp);text-align:center;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.14em;line-height:1.1}
.stamp span{display:block;font-weight:600;font-size:13px}
.stamp b{display:block;font:500 11px var(--f-mono);letter-spacing:.06em}
.ein-main{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tray{flex:0 0 auto;width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;animation:bob 3.2s ease-in-out infinite}
.eingang.drag .tray{animation-duration:.9s}
.ein-text{flex:1 1 140px;min-width:0}
.ein-text h2{font:600 28px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.ein-text p{color:var(--ink-3);font-size:13px;margin-top:4px}
.ein-actions{display:flex;gap:10px;flex:1 1 100%}
.ein-actions .btn{flex:1}
@media (min-width:640px){.ein-actions{flex:0 0 auto}}
.queue{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.queue:empty{display:none}
.queue li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:13px}
.q-ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.q-ic.ok{background:var(--ok-bg);color:var(--ok);animation:pop .35s}
.q-ic.err{background:var(--warn-bg);color:var(--warn)}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
.q-text{min-width:0;display:flex;flex-direction:column}
.q-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.q-sub{color:var(--ink-2);font-size:12.5px;display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:hsl(var(--h,215) var(--fold-s) calc(var(--fold-l) + var(--dl,0%)))}
.queue .clear{display:block;padding:0;background:none}
.notice{padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.notice.info{background:var(--accent-soft);color:var(--accent)}
.search{position:relative}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:400 16px var(--f-body)}
.search input{padding-left:42px;border-radius:999px}
.block{display:flex;flex-direction:column;gap:12px}
h2.label{font:600 21px/1.1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
h2.label .ic{color:var(--ink-3)}
.empty-note{color:var(--ink-3);font-size:14px}
.folds{display:grid;gap:8px 10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.fold{--c:hsl(var(--h) var(--fs,var(--fold-s)) calc(var(--fold-l) + var(--dl,0%)));--cb:hsl(var(--h) var(--fs,var(--fold-s)) calc(var(--fold-back-l) + var(--dl,0%)));position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;border:0;background:none;padding:8px 6px 10px;color:var(--ink);font:inherit;cursor:pointer;border-radius:14px;min-width:0}
.fold-art{width:100%;height:auto;display:block;overflow:visible;transition:transform .2s}
.f-back{fill:var(--cb)}.f-face{fill:var(--c)}
.f-paper{fill:var(--paper);stroke:var(--paper-line);stroke-width:.6}
.f-line{stroke:var(--paper-line);stroke-width:2;stroke-linecap:round;fill:none}
.f-icon{stroke:var(--fold-ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.f-sheets{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
@media (hover:hover){.fold:hover .f-sheets{transform:translateY(-9px)}.fold:hover .fold-art{transform:translateY(-2px)}}
.fold:active .f-sheets{transform:translateY(-9px)}
.fold.pulse .fold-art{animation:bump .8s}
.fold.is-empty .fold-art{opacity:.55;filter:saturate(.55)}
.fold-badge{position:absolute;top:6px;right:8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--ink);color:var(--bg);font:500 12.5px/26px var(--f-mono);text-align:center}
.fold-name{font:600 20px/1.1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;margin-top:6px;overflow-wrap:anywhere}
.fold-desc{font-size:12.5px;line-height:1.35;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.crumbs{display:flex}
.hero{display:flex;gap:16px;align-items:center}
.hero-art{width:128px;flex:0 0 auto}
.hero-text{display:flex;flex-direction:column;gap:4px;min-width:0}
.hero-text h2{font:600 clamp(30px,8vw,40px)/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere}
.hero-text p{color:var(--ink-2)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:500 13px var(--f-body);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill .n{font:500 11.5px var(--f-mono);opacity:.7}
.sub-head{display:flex;align-items:center;gap:10px}
.sub-head h3{font:600 19px/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.sub-head .n{font:400 12px var(--f-mono);color:var(--ink-3)}
.tiles{list-style:none;padding:0;display:grid;gap:18px 12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.tile{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.paper{position:relative;display:block;aspect-ratio:3/4;background:var(--paper);border-radius:4px;box-shadow:0 1px 2px rgba(10,20,30,.22),0 8px 16px -10px rgba(10,20,30,.4);overflow:hidden;text-decoration:none;color:var(--paper-ink);transition:transform .15s}
.paper:hover{transform:translateY(-2px)}
.paper img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.paper.nofile{display:grid;place-items:center}
.ft{display:flex;flex-direction:column;align-items:center;gap:6px;font:500 12px var(--f-mono)}
.type-badge{position:absolute;left:6px;bottom:6px;font:500 10.5px var(--f-mono);padding:1px 6px;border-radius:3px;background:var(--ink);color:var(--bg)}
.tile-edit{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(10,20,30,.35);display:grid;place-items:center;cursor:pointer}
.t-title{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;margin-top:4px}
.t-meta{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11.5px var(--f-mono);padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.crumb-link{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;color:var(--accent);background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .btn{margin-top:4px}
.dues{list-style:none;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.due{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 10px 10px 0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.due-n{align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ok-bg);color:var(--ok);line-height:1;gap:4px}
.due.soon .due-n,.due.late .due-n{background:var(--warn-bg);color:var(--warn)}
.due-n b{font:600 28px/1 var(--f-display)}
.due-n span{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.04em}
.due-body{min-width:0;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink)}
.due-body strong{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due-body em{font-style:normal;font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due-ok{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ok);display:grid;place-items:center;cursor:pointer}
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,16,22,.55)}
.sheet{position:relative;width:min(100%,540px);max-height:92%;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:rise .25s both}
@media (min-width:600px){#modal{align-items:center}.sheet{border-radius:18px;padding-bottom:18px}}
.sheet-head{display:flex;gap:12px;align-items:center}
.mini-paper{width:44px;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:3px;background:var(--paper);box-shadow:0 1px 3px rgba(10,20,30,.3);flex:0 0 auto}
.sheet h2{font:600 24px/1.1 var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.sheet .file-name{font:400 12px var(--f-mono);color:var(--ink-3);overflow-wrap:anywhere}
.sheet form{display:flex;flex-direction:column;gap:6px}
.sheet label.l{font-size:13px;font-weight:500;color:var(--ink-2);margin-top:6px}
.catpick{border:0;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pick{position:relative;display:block}
.pick input{position:absolute;opacity:0;inset:0;width:100%;height:100%;min-height:0;cursor:pointer}
.pick span{--c:hsl(var(--h) var(--fs,var(--fold-s)) calc(var(--fold-l) + var(--dl,0%)));display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--c);font:500 12px/1.2 var(--f-body);text-align:center}
.pick span em{font-style:normal;color:var(--ink)}
.pick input:checked + span{border-color:var(--accent);background:var(--accent-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sheet-info{font-size:13px;color:var(--ink-2);margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,20px);max-width:min(92vw,460px);padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
#toast.on{opacity:1;transform:translate(-50%,0)}
.ocr-progress{font:500 12px var(--f-mono);color:var(--ink-3);margin-top:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="brand">
      <span class="brand-ic"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 12h16"/><path d="M10 7.5h4M10 16.5h4"/></svg></span>
      <div>
        <h1>Mein Aktenschrank</h1>
        <p class="stats" id="stats">…</p>
      </div>
    </div>
    <button type="button" class="btn" id="btn-export" data-act="export" disabled>
      <svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7.5 11 4.5 4.5 4.5-4.5"/><path d="M5 20h14"/></svg>
      <span>ZIP</span>
    </button>
  </header>

  <section class="eingang" id="eingang" aria-label="Eingang">
    <div class="stamp"><span>Eingegangen</span><b id="stamp-date"></b></div>
    <div class="ein-main">
      <div class="tray"><svg class="ic" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="m7.5 10 4.5 4.5 4.5-4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></div>
      <div class="ein-text"><h2>Eingang</h2><p>Briefe, Scans, Fotos · PDF, JPG, PNG</p></div>
      <div class="ein-actions">
        <button type="button" class="btn primary" data-act="pick"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></svg>Dateien</button>
        <button type="button" class="btn" data-act="shoot"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>Foto</button>
      </div>
    </div>
    <input id="file" type="file" multiple hidden accept="application/pdf,image/jpeg,image/png,image/webp,image/gif,text/plain,text/csv,.pdf,.jpg,.jpeg,.png,.webp,.gif,.txt,.csv,.md">
    <input id="cam" type="file" hidden accept="image/jpeg,image/png" capture="environment">
    <ul class="queue" id="queue" aria-live="polite"></ul>
  </section>

  <div id="notice"></div>

  <div class="search">
    <svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
    <label class="sr" for="q">Dokumente durchsuchen</label>
    <input id="q" type="search" placeholder="Suchen" autocomplete="off">
  </div>

  <div id="content"></div>
</main>

<div id="modal" hidden></div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<script>
(function(){
'use strict';

/* ============ ICONS ============ */

/* ============ HELPERS ============ */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function validIso(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return false;var p=s.split('-').map(Number);var d=new Date(p[0],p[1]-1,p[2]);return d.getFullYear()===p[0]&&d.getMonth()===p[1]-1&&d.getDate()===p[2];}
function fmtDate(s){return validIso(s)?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'';}
function daysUntil(s){var p=s.split('-').map(Number);var t=new Date();var a=new Date(p[0],p[1]-1,p[2]);var b=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((a-b)/864e5);}
function plural(n,one,many){return n+' '+(n===1?one:many);}
function extOf(n){var m=/\.([A-Za-z0-9]{1,5})$/.exec(n||'');return m?m[1].toLowerCase():'';}
function baseName(n){return String(n||'Dokument').replace(/\.[A-Za-z0-9]{1,5}$/,'').replace(/[_]+/g,' ').trim().slice(0,80)||'Dokument';}
function cleanName(s){return String(s||'').replace(/[\\\/:*?"<>|\u0000-\u001f]/g,' ').replace(/\s+/g,' ').trim().slice(0,40);}
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(S.tt);S.tt=setTimeout(function(){t.classList.remove('on');},4200);}

function byDocDate(a,b){var x=a.datum||'',y=b.datum||'';if(x!==y)return x<y?1:-1;return (b.added||0)-(a.added||0);}
function subsFor(catId){
  var seen=new Map();
  (CAT_BY[catId]?CAT_BY[catId].subs:[]).forEach(function(s){seen.set(s.toLowerCase(),s);});
  S.docs.forEach(function(d){if(catOf(d)===catId){var l=subOf(d).toLowerCase();if(!seen.has(l))seen.set(l,subOf(d));}});
  return Array.from(seen.values());
}

/* ============ INDEXEDDB ============ */
function idbOpen(){
  return new Promise(function(res,rej){
    var req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=function(ev){
      var db=ev.target.result;
      if(!db.objectStoreNames.contains('docs')){var st=db.createObjectStore('docs',{keyPath:'id'});st.createIndex('added','added');}
      if(!db.objectStoreNames.contains('files')){db.createObjectStore('files');}
    };
    req.onsuccess=function(){DB=req.result;res(DB);};
    req.onerror=function(){rej(req.error);};
  });
}
function idbAll(store){return new Promise(function(res,rej){var t=DB.transaction(store,'readonly').objectStore(store).getAll();t.onsuccess=function(){res(t.result);};t.onerror=function(){rej(t.error);};});}
function idbGet(store,key){return new Promise(function(res,rej){var t=DB.transaction(store,'readonly').objectStore(store).get(key);t.onsuccess=function(){res(t.result);};t.onerror=function(){rej(t.error);};});}
function idbPut(store,val,key){return new Promise(function(res,rej){var t=DB.transaction(store,'readwrite').objectStore(store);var r=key!==undefined?t.put(val,key):t.put(val);r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function idbDel(store,key){return new Promise(function(res,rej){var t=DB.transaction(store,'readwrite').objectStore(store).delete(key);t.onsuccess=function(){res();};t.onerror=function(){rej(t.error);};});}
function idbClear(store){return new Promise(function(res,rej){var t=DB.transaction(store,'readwrite').objectStore(store).clear();t.onsuccess=function(){res();};t.onerror=function(){rej(t.error);};});}

function withTimeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error('timeout'));},ms);p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}

function imgThumb(file){
  return new Promise(function(res){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      try{
        var sc=Math.min(1,300/im.naturalWidth),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.naturalWidth*sc));c.height=Math.max(1,Math.round(im.naturalHeight*sc));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.65));
      }catch(e){res('');}
      URL.revokeObjectURL(url);
    };
    im.onerror=function(){URL.revokeObjectURL(url);res('');};
    im.src=url;
  });
}

async function pdfContent(file){
  if(!window.pdfjsLib)return {text:'',thumb:''};
  try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}catch(e){}
  var buf=await file.arrayBuffer();
  var pdf=await withTimeout(window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise,30000);
  var thumb='';
  try{
    var p1=await pdf.getPage(1),v1=p1.getViewport({scale:1}),vt=p1.getViewport({scale:260/v1.width});
    var ct=document.createElement('canvas');ct.width=Math.ceil(vt.width);ct.height=Math.ceil(vt.height);
    var cx=ct.getContext('2d');cx.fillStyle='#ffffff';cx.fillRect(0,0,ct.width,ct.height);
    await p1.render({canvasContext:cx,viewport:vt}).promise;
    thumb=ct.toDataURL('image/jpeg',0.65);
  }catch(e){}
  var text='',n=Math.min(pdf.numPages,5),i;
  for(i=1;i<=n;i++){
    var p=await pdf.getPage(i);
    var tc=await p.getTextContent();
    text+=tc.items.map(function(it){return it.str;}).join(' ')+'\n';
    if(text.length>16000)break;
  }
  text=text.replace(/\s+/g,' ').trim();
  return {text:text,thumb:thumb,numPages:pdf.numPages};
}

async function ocrImage(file,onProgress){
  if(!window.Tesseract)return '';
  try{
    var worker=await Tesseract.createWorker('deu',1,{
      logger:function(m){if(onProgress&&m.status==='recognizing text')onProgress(Math.round(m.progress*100));}
    });
    var ret=await worker.recognize(file);
    await worker.terminate();
    return (ret.data.text||'').replace(/\s+/g,' ').trim();
  }catch(e){
    console.warn('OCR Fehler',e);
    return '';
  }
}

async function extractContent(file,onStatus){
  var ext=extOf(file.name),type=MIME_BY_EXT[ext]||file.type||'';
  if(type==='application/pdf'){
    onStatus('PDF wird gelesen …');
    var pdf=await pdfContent(file);
    // Wenn PDF keinen Text hat, ist es ein Scan → OCR
    if(pdf.text.length<80&&pdf.thumb){
      onStatus('Scan wird per OCR gelesen …');
      try{
        var blob=await (await fetch(pdf.thumb)).blob();
        var f2=new File([blob],'seite.jpg',{type:'image/jpeg'});
        var ocrText=await ocrImage(f2,function(p){onStatus('OCR '+p+'%');});
        pdf.text=(pdf.text+' '+ocrText).trim();
      }catch(e){}
    }
    return {text:pdf.text,thumb:pdf.thumb};
  }
  if(/^image\/(jpeg|png|webp|gif)$/.test(type)){
    var thumb=await imgThumb(file);
    onStatus('Bild wird per OCR gelesen …');
    var text=await ocrImage(file,function(p){onStatus('OCR '+p+'%');});
    return {text:text,thumb:thumb};
  }
  if(/^text\//.test(type)){
    onStatus('Text wird gelesen …');
    return {text:(await file.text()).slice(0,16000),thumb:''};
  }
  return {text:'',thumb:''};
}

var MONTHS_DE={januar:1,februar:2,'märz':3,april:4,mai:5,juni:6,juli:7,august:8,september:9,oktober:10,november:11,dezember:12};

function findDates(text){
  var dates=[];
  var re1=/\b(\d{1,2})\.(\d{1,2})\.(\d{2,4})\b/g,m;
  while((m=re1.exec(text))){
    var y=Number(m[3]);if(y<100)y+=y<50?2000:1900;
    var d=Number(m[1]),mo=Number(m[2]);
    if(d>=1&&d<=31&&mo>=1&&mo<=12&&y>=1900&&y<=2100)dates.push({y:y,m:mo,d:d});
  }
  var re2=/\b(\d{1,2})\.?\s+(Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember)\s+(\d{4})\b/gi;
  while((m=re2.exec(text))){
    var mo=MONTHS_DE[m[2].toLowerCase()];
    if(mo)dates.push({y:Number(m[3]),m:mo,d:Number(m[1])});
  }
  return dates;
}

function isoOf(dt){return dt.y+'-'+pad(dt.m)+'-'+pad(dt.d);}

function extractMeta(text,fileName){
  var meta={titel:'',absender:'',datum:'',frist:'',info:'',conf:0};
  var lower=text.toLowerCase();

  // Absender: Firma/Behörde – erste Zeile die auf GmbH, AG, KG, Amt etc. endet
  var reFirm=/\b([A-ZÄÖÜ][A-Za-zÄÖÜäöüß&.\- ]{2,40}?\s(?:GmbH|AG|KG|OHG|GbR|e\.?V\.?|mbH|Amt|Finanzamt|Krankenkasse|Versicherung|Bank|Sparkasse|Behörde|Stadt|Gemeinde|Gericht|Kasse|Verband|Stiftung))\b/;
  var mFirm=reFirm.exec(text);
  if(mFirm)meta.absender=mFirm[1].trim().slice(0,60);

  // Datum: das letzte Datum (meist das relevante)
  var dates=findDates(text);
  if(dates.length){
    // Wähle das plausibelste: nicht zu weit in Vergangenheit/Zukunft
    var now=new Date(),chosen=dates[0];
    var bestDiff=Infinity;
    dates.forEach(function(d){
      var diff=Math.abs(new Date(d.y,d.m-1,d.d)-now);
      if(diff<bestDiff){bestDiff=diff;chosen=d;}
    });
    meta.datum=isoOf(chosen);
  }

  // Frist: Suche nach "bis zum", "Zahlungsziel", "Frist", "fällig", "Widerspruch"
  var reFrist=/(?:bis(?:\s+zum)?|zahlungsziel|frist|fällig(?:\s+am)?|widerspruch(?:sfrist)?|kündigung(?:sfrist)?|zahlung\s+bis)[^\d]{0,40}(\d{1,2})\.(\d{1,2})\.(\d{2,4})/i;
  var mFrist=reFrist.exec(text);
  if(mFrist){
    var y=Number(mFrist[3]);if(y<100)y+=y<50?2000:1900;
    var d=Number(mFrist[1]),mo=Number(mFrist[2]);
    if(d>=1&&d<=31&&mo>=1&&mo<=12)meta.frist=y+'-'+pad(mo)+'-'+pad(d);
  }

  // Titel: Erste sinnvolle Zeile ohne Anrede
  var lines=text.split(/[.\n]/).map(function(l){return l.trim();}).filter(function(l){return l.length>8&&l.length<90;});
  var skip=/^(sehr geehrte|liebe|hallo|guten tag|damen und herren|mit freundlichen|freundliche grüße)/i;
  for(var i=0;i<lines.length;i++){
    if(!skip.test(lines[i])&&/[a-zäöüß]/.test(lines[i])){
      meta.titel=lines[i].slice(0,70);
      break;
    }
  }
  if(!meta.titel)meta.titel=baseName(fileName);

  // Info-Snippet
  meta.info=text.replace(/\s+/g,' ').trim().slice(0,140);

  return meta;
}

/* ============ KLASSIFIKATION (regelbasiert) ============ */
function classify(text,fileName){
  var lower=(' '+text.toLowerCase()+' '+fileName.toLowerCase()+' ');
  var scores={};
  CATS.forEach(function(c){
    var score=0;
    c.kw.forEach(function(k){if(lower.indexOf(' '+k.toLowerCase()+' ')>-1||lower.indexOf(k.toLowerCase())>-1)score+=1;});
    scores[c.id]=score;
  });
  var best='Sonstiges',bestScore=0;
  Object.keys(scores).forEach(function(k){if(scores[k]>bestScore){best=scores[k]?k:best;bestScore=scores[k];}});
  if(bestScore===0)best='Sonstiges';

  // Unterordner wählen: prüfe Subs der gewählten Kategorie
  var cat=CAT_BY[best];
  var sub=cat.subs[0];
  var subKeywords={
    'Steuerbescheide':['steuerbescheid','einkommensteuerbescheid'],
    'Steuererklärung':['steuererklärung','elster'],
    'Krankenversicherung':['krankenversicherung','krankenkasse','aok','tk','barmer','dak'],
    'Haftpflicht':['haftpflicht'],
    'Hausrat':['hausrat'],
    'Kfz-Versicherung':['kfz-versicherung','kfz versicherung','auto versicherung'],
    'Rechtsschutz':['rechtsschutz'],
    'Kontoauszüge':['kontoauszug','kontoauszüge'],
    'Kredite':['kredit','darlehen','baufinanzierung'],
    'Kreditkarte':['kreditkarte','visa','mastercard'],
    'Schufa':['schufa'],
    'Arbeitsvertrag':['arbeitsvertrag','arbeitsvereinbarung'],
    'Gehaltsabrechnungen':['gehaltsabrechnung','lohnabrechnung','entgeltabrechnung'],
    'Kündigung':['kündigung'],
    'Arbeitszeugnisse':['arbeitszeugnis','zeugnis arbeits'],
    'Bewerbungen':['bewerbung','lebenslauf'],
    'Mietvertrag':['mietvertrag'],
    'Nebenkosten':['nebenkosten','betriebskosten'],
    'Strom und Gas':['strom','gas','stadtwerke','energie'],
    'Internet und Telefon':['internet','telefon','telekom','vodafone','o2'],
    'Arztbriefe':['arztbrief','befundbericht'],
    'Rezepte':['rezept','verschreibung'],
    'Arztrechnungen':['arztrechnung','zahnarztrechnung'],
    'Impfungen':['impfung','impfpass','impfstoff'],
    'Personalausweis':['personalausweis'],
    'Reisepass':['reisepass','pass beantragt'],
    'Geburtsurkunde':['geburtsurkunde'],
    'Führerschein':['führerschein'],
    'Kindergeld':['kindergeld'],
    'Elterngeld':['elterngeld'],
    'Kita und Schule':['kita','kindergarten','schule','schulanmeldung'],
    'Zeugnisse':['zeugnis','schulzeugnis'],
    'Zertifikate':['zertifikat','bescheinigung kurs'],
    'Weiterbildung':['weiterbildung','fortbildung','seminar'],
    'Rechnungen':['rechnung','rechnungsnummer'],
    'Garantie':['garantie','garantieschein'],
    'Reklamation':['reklamation','retoure','rücksendung'],
    'Handy':['handy','mobilfunk','mobilvertrag'],
    'Streaming':['netflix','spotify','disney','sky','streaming'],
    'Mitgliedschaften':['mitgliedschaft','verein','fitnessstudio'],
    'Rentenversicherung':['rentenversicherung','rentenbescheid'],
    'Betriebsrente':['betriebsrente'],
    'Vorsorge':['riester','rürup','lebensversicherung','altersvorsorge'],
    'Werkstatt':['werkstatt','reparatur','inspektion'],
    'TÜV':['tüv','hauptuntersuchung'],
    'Bußgelder':['bußgeld','verwarnung verkehr'],
    'Fahrzeugpapiere':['fahrzeugschein','fahrzeugbrief','zulassung'],
    'Einwohnermeldeamt':['einwohnermeldeamt','meldeamt','meldebescheinigung'],
    'Ausländerbehörde':['ausländerbehörde','aufenthaltstitel'],
    'Familienkasse':['familienkasse'],
    'Rundfunkbeitrag':['rundfunkbeitrag','ard zdf'],
    'Gericht':['gericht','amtsgericht','landgericht']
  };
  var subScores={};
  cat.subs.forEach(function(s){subScores[s]=0;});
  Object.keys(subKeywords).forEach(function(sk){
    if(cat.subs.indexOf(sk)===-1)return;
    subKeywords[sk].forEach(function(k){if(lower.indexOf(k)>-1)subScores[sk]+=1;});
  });
  var bestSub=cat.subs[0],bestSubScore=0;
  Object.keys(subScores).forEach(function(k){if(subScores[k]>bestSubScore){bestSub=k;bestSubScore=subScores[k];}});
  if(bestSubScore>0)sub=bestSub;

  // Konfidenz
  var conf=Math.min(1,bestScore*0.18);
  if(best==='Sonstiges')conf=0.2;

  return {k:best,u:sub,conf:conf};
}

function buildMeta(file,text){
  var meta=extractMeta(text,file.name);
  var cls=classify(text,file.name);
  var pruefen=cls.conf<0.35;
  return {
    k:cls.k,u:cls.u,
    titel:meta.titel||baseName(file.name),
    absender:meta.absender,
    datum:meta.datum,
    frist:meta.frist,
    info:meta.info,
    conf:cls.conf,
    pruefen:pruefen
  };
}

/* ============ QUEUE ============ */
function enqueue(fileList){
  var files=Array.prototype.slice.call(fileList||[]);
  if(!files.length)return;
  files.forEach(function(f){S.queue.push({file:f,state:'wartet',msg:'',where:'',hue:215,status:''});});
  renderQueue();
  if(!S.running)runQueue();
}

async function runQueue(){
  S.running=true;
  var done=0,it;
  while((it=S.queue.filter(function(x){return x.state==='wartet';})[0])){
    try{await processFile(it);}catch(e){it.state='fehler';it.msg='Unerwarteter Fehler.';console.error(e);}
    if(it.state==='ok')done++;
    renderQueue();
  }
  S.running=false;renderQueue();
  if(done)toast(plural(done,'Dokument','Dokumente')+' einsortiert.');
}

async function processFile(it){
  var f=it.file,ext=extOf(f.name),mime=MIME_BY_EXT[ext];
  if(!mime){it.state='fehler';it.msg='Dateityp nicht unterstützt.';return;}
  if(f.size>30*1024*1024){it.state='fehler';it.msg='Datei größer als 30 MB.';return;}
  if(f.size===0){it.state='fehler';it.msg='Datei ist leer.';return;}
  if(S.docs.some(function(d){return d.name===f.name&&d.size===f.size;})){it.state='doppelt';it.msg='Schon vorhanden.';return;}
  it.state='lesen';it.status='Wird gelesen …';renderQueue();
  var content={text:'',thumb:''};
  try{content=await extractContent(f,function(s){it.status=s;renderQueue();});}
  catch(e){it.state='fehler';it.msg='Lesen fehlgeschlagen.';return;}
  it.status='Wird einsortiert …';renderQueue();
  var meta=buildMeta(f,content.text||'');
  var id='doc_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  var doc={id:id,type:'doc',name:f.name,size:f.size,mime:mime,added:Date.now(),
    k:meta.k,u:meta.u,titel:meta.titel,absender:meta.absender,datum:meta.datum,frist:meta.frist,info:meta.info,
    conf:meta.conf,pruefen:meta.pruefen,thumb:content.thumb||''};
  try{
    await idbPut('docs',doc);
    await idbPut('files',f,id);
  }catch(e){it.state='fehler';it.msg='Speichern fehlgeschlagen.';return;}
  it.state='ok';it.hue=CAT_BY[meta.k].h;it.dl=CAT_BY[meta.k].dl||'';it.where=meta.k+' › '+meta.u;it.check=meta.pruefen;
}

function renderQueue(){
  var el=$('#queue');
  if(!S.queue.length){el.innerHTML='';return;}
  var rows=S.queue.slice(-8).map(function(it){
    var icon,sub;
    if(it.state==='lesen'){icon='<span class="q-ic"><span class="spin"></span></span>';sub=esc(it.status||'Wird gelesen …');}
    else if(it.state==='ok'){icon='<span class="q-ic ok">'+ic('check',16)+'</span>';sub='<span class="dot" style="--h:'+it.hue+(it.dl?';--dl:'+it.dl:'')+'"></span>'+esc(it.where)+(it.check?' · bitte prüfen':'');}
    else if(it.state==='doppelt'){icon='<span class="q-ic">'+ic('file',16)+'</span>';sub=esc(it.msg);}
    else if(it.state==='fehler'){icon='<span class="q-ic err">'+ic('alert',16)+'</span>';sub=esc(it.msg);}
    else{icon='<span class="q-ic">'+ic('file',16)+'</span>';sub='Wartet';}
    return '<li>'+icon+'<span class="q-text"><span class="q-name">'+esc(it.file.name)+'</span><span class="q-sub">'+sub+'</span></span></li>';
  }).join('');
  var finished=!S.running&&S.queue.some(function(x){return x.state!=='wartet'&&x.state!=='lesen';});
  el.innerHTML=rows+(finished?'<li class="clear"><button type="button" class="btn sm" data-act="clearq">Liste leeren</button></li>':'');
}

/* ============ BLOB URLS ============ */
async function ensureBlobUrl(docId){
  if(S.blobUrls[docId])return S.blobUrls[docId];
  var blob=await idbGet('files',docId);
  if(!blob)return '';
  var url=URL.createObjectURL(blob);
  S.blobUrls[docId]=url;
  return url;
}
async function refreshBlobUrls(){
  for(var i=0;i<S.docs.length;i++){
    var d=S.docs[i];
    if(!S.blobUrls[d.id])await ensureBlobUrl(d.id);
  }
}

  return '<svg class="fold-art'+(cls?' '+cls:'')+'" viewBox="0 0 120 94"><path class="f-back" d="M8 10a6 6 0 0 1 6-6h27a6 6 0 0 1 4.6 2.2L51 13h55a6 6 0 0 1 6 6v64a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z"/><g class="f-sheets">'+sheets+'</g><path class="f-face" d="M8 30a6 6 0 0 1 6-6h92a6 6 0 0 1 6 6v53a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z"/><path d="M8 30a6 6 0 0 1 6-6h92a6 6 0 0 1 6 6v3H8z" fill="#ffffff" opacity=".14"/><svg class="f-icon" x="44" y="40" width="32" height="32" viewBox="0 0 24 24">'+ICON[c.ic]+'</svg></svg>';
}
function foldHtml(c,i){
  var n=S.docs.filter(function(d){return catOf(d)===c.id;}).length;
  return '<button type="button" class="fold'+(n?'':' is-empty')+(S.pulse===c.id?' pulse':'')+'" style="'+catVars(c)+';--i:'+i+'" data-act="open-cat" data-cat="'+esc(c.id)+'">'+folderSvg(c,n)+(n?'<span class="fold-badge">'+n+'</span>':'')+'<span class="fold-name">'+esc(c.short)+'</span><span class="fold-desc">'+esc(c.desc)+'</span></button>';

function dueText(dl){return dl<0?'überfällig':dl===0?'heute':dl===1?'noch 1 Tag':'noch '+dl+' Tage';}

function docTile(d,o,i){
  o=o||{};
  var ext=extOf(d.name),isImg=/^image\//.test(d.mime||'');
  var url=S.blobUrls[d.id]||'';
  var art=d.thumb?'<img src="'+esc(d.thumb)+'" alt="" loading="lazy">':isImg&&url?'<img src="'+esc(url)+'" alt="" loading="lazy">':'<span class="ft">'+ic('file',30)+'</span>';
  var meta=[d.absender,fmtDate(d.datum)].filter(Boolean).join(' · ');
  var chips='';
  if(d.frist&&validIso(d.frist)){var dl=daysUntil(d.frist);chips+='<span class="chip'+(dl<=14?' warn':'')+'">'+ic('clock',12)+esc(dueText(dl))+'</span>';}
  if(d.pruefen)chips+='<span class="chip warn">'+ic('alert',12)+'prüfen</span>';
  var c=CAT_BY[catOf(d)];
  var crumb=o.crumb?'<button type="button" class="crumb-link" data-act="open-cat" data-cat="'+esc(c.id)+'"><span class="dot" style="'+catVars(c)+'"></span>'+esc(c.short)+' › '+esc(subOf(d))+'</button>':'';
  var href=url||'#';
  return '<li class="tile" style="--i:'+(i||0)+'">'+
    '<a class="paper'+(d.thumb||isImg?'':' nofile')+'" href="'+esc(href)+'" target="_blank" rel="noopener"><span style="position:absolute;inset:0">'+art+'</span><span class="type-badge">'+esc((ext||'datei').toUpperCase())+'</span></a>'+
    '<button type="button" class="tile-edit" data-act="edit" data-id="'+esc(d.id)+'" aria-label="Bearbeiten">'+ic('edit',16)+'</button>'+
    '<div class="t-title">'+esc(d.titel||d.name)+'</div>'+(meta?'<div class="t-meta">'+esc(meta)+'</div>':'')+crumb+
    (chips?'<div class="chips">'+chips+'</div>':'')+
    (o.ok?'<button type="button" class="btn sm primary" data-act="ok" data-id="'+esc(d.id)+'">'+ic('check',16)+'Passt so</button>':'')+'</li>';
}

function dueCard(d,i){
  var dl=daysUntil(d.frist),cls=dl<0?'late':dl<=14?'soon':'';
  var num=dl<0?'<b>'+Math.abs(dl)+'</b><span>überfällig</span>':dl===0?'<b>0</b><span>heute</span>':'<b>'+dl+'</b><span>'+(dl===1?'Tag':'Tage')+'</span>';
  var url=S.blobUrls[d.id]||'#';
  return '<li class="due '+cls+'" style="--i:'+i+'"><div class="due-n">'+num+'</div>'+
    '<a class="due-body" href="'+esc(url)+'" target="_blank" rel="noopener"><strong>'+esc(d.titel||d.name)+'</strong><em>'+esc([d.absender,fmtDate(d.frist)].filter(Boolean).join(' · '))+'</em></a>'+
    '<button type="button" class="due-ok" data-act="done" data-id="'+esc(d.id)+'" aria-label="Erledigt">'+ic('check',20)+'</button></li>';
}

function homeHtml(){
  var h='';
  var fr=S.docs.filter(function(d){return d.frist&&validIso(d.frist);}).sort(function(a,b){return a.frist<b.frist?-1:1;}).slice(0,6);
  if(fr.length)h+='<section class="block"><h2 class="label">'+ic('clock',20)+'Fristen</h2><ul class="dues'+ENT+'">'+fr.map(dueCard).join('')+'</ul></section>';
  var pr=S.docs.filter(function(d){return d.pruefen;}).sort(function(a,b){return (b.added||0)-(a.added||0);});
  if(pr.length)h+='<section class="block"><h2 class="label">'+ic('alert',20)+'Bitte prüfen</h2><ul class="tiles'+ENT+'">'+pr.map(function(d,i){return docTile(d,{crumb:true,ok:true},i);}).join('')+'</ul></section>';
  h+='<section class="block"><h2 class="label">'+ic('folder',20)+'Ordner</h2>'+
    (!S.docs.length?'<p class="empty-note">Leer. Leg das erste Dokument in den Eingang.</p>':'')+
    '<div class="folds'+ENT+'">'+CATS.map(foldHtml).join('')+'</div></section>';
  return h;
}

function catHtml(catId){
  var c=CAT_BY[catId]||CAT_BY['Sonstiges'];
  var docs=S.docs.filter(function(d){return catOf(d)===c.id;});
  var groups={};docs.forEach(function(d){var s=subOf(d);(groups[s]=groups[s]||[]).push(d);});
  var names=Object.keys(groups).sort(function(a,b){return a.localeCompare(b,'de');});
  if(S.sub&&!groups[S.sub])S.sub=null;
  var h='<div class="crumbs"><button type="button" class="btn sm" data-act="home">'+ic('back',16)+'Aktenschrank</button></div>'+
    '<div class="hero" style="'+catVars(c)+'">'+folderSvg(c,docs.length,'hero-art')+'<div class="hero-text"><h2>'+esc(c.id)+'</h2><p>'+esc(c.desc)+'</p><span class="stats">'+(docs.length?plural(docs.length,'Dokument','Dokumente'):'Noch leer')+'</span></div></div>';
  if(names.length>1||S.sub){
    h+='<div class="filters"><button type="button" class="pill" data-act="sub" data-sub="" aria-pressed="'+(S.sub?'false':'true')+'">Alle<span class="n">'+docs.length+'</span></button>'+
      names.map(function(s){return '<button type="button" class="pill" data-act="sub" data-sub="'+esc(s)+'" aria-pressed="'+(S.sub===s?'true':'false')+'">'+esc(s)+'<span class="n">'+groups[s].length+'</span></button>';}).join('')+
      (S.sub?'<button type="button" class="pill" data-act="rename" data-cat="'+esc(c.id)+'" data-sub="'+esc(S.sub)+'">'+ic('edit',14)+'Umbenennen</button>':'')+'</div>';
  }
  if(!docs.length)h+='<p class="empty-note">Hier ist noch nichts.</p>';
  (S.sub?[S.sub]:names).forEach(function(s){
    var list=groups[s].slice().sort(byDocDate);
    h+='<section class="block">'+(S.sub?'':'<div class="sub-head"><span class="dot" style="'+catVars(c)+'"></span><h3>'+esc(s)+'</h3><span class="n">'+list.length+'</span></div>')+
      '<ul class="tiles'+ENT+'">'+list.map(function(d,i){return docTile(d,{},i);}).join('')+'</ul></section>';
  });
  return h;
}

function searchHtml(q){
  var words=q.split(/\s+/).filter(Boolean);
  var res=S.docs.filter(function(d){
    var hay=[d.titel,d.absender,d.info,d.name,d.k,d.u,fmtDate(d.datum)].join(' ').toLowerCase();

  }).sort(byDocDate);
  if(!res.length)return '<p class="empty-note">Nichts gefunden.</p>';
  return '<section class="block"><h2 class="label">'+ic('search',20)+plural(res.length,'Treffer','Treffer')+'</h2><ul class="tiles'+ENT+'">'+res.map(function(d,i){return docTile(d,{crumb:true},i);}).join('')+'</ul></section>';

    '<form id="rename-form"><label class="l" for="r-n">Neuer Name</label><input id="r-n" list="dl-r" maxlength="40" value="'+esc(sub)+'"><datalist id="dl-r">'+others+'</datalist>'+
    '<p class="sheet-info">Ein vorhandener Name führt beide Unterordner zusammen.</p>'+
    '<div class="sheet-actions"><button type="submit" class="btn primary">Speichern</button><button type="button" class="btn" data-act="close">Abbrechen</button></div></form>');
}

async function saveEdit(){
  var e=S.edit;if(!e||!e.id)return;
  var sel=document.querySelector('input[name="k"]:checked');var k=sel?sel.value:'Sonstiges';
  var u=cleanName($('#f-u').value)||CAT_BY[k].subs[0];
  var known=subsFor(k).filter(function(s){return s.toLowerCase()===u.toLowerCase();})[0];if(known)u=known;
  var datum=$('#f-d').value,frist=$('#f-f').value;
  var d=S.docs.find(function(x){return x.id===e.id;});if(!d)return;
  var upd=Object.assign({},d,{k:k,u:u,titel:$('#f-t').value.trim().slice(0,80)||'Dokument',absender:$('#f-a').value.trim().slice(0,60),
    datum:validIso(datum)?datum:'',frist:validIso(frist)?frist:'',pruefen:false});
  try{await idbPut('docs',upd);closeModal();toast('Gespeichert.');}
  catch(err){toast('Speichern fehlgeschlagen.');}
}

async function saveRename(){
  var e=S.edit;if(!e||!e.cat)return;
  var n=cleanName($('#r-n').value);if(!n||n===e.sub){closeModal();return;}
  var known=subsFor(e.cat).filter(function(s){return s.toLowerCase()===n.toLowerCase();})[0];if(known)n=known;
  var list=S.docs.filter(function(d){return catOf(d)===e.cat&&subOf(d)===e.sub;});
  var wasSub=S.sub===e.sub;
  closeModal();
  for(var i=0;i<list.length;i++){var d=Object.assign({},list[i],{u:n});try{await idbPut('docs',d);}catch(x){}}
  if(wasSub)S.sub=n;
  toast(plural(list.length,'Dokument','Dokumente')+' verschoben.');
}

async function deleteDoc(){
  var e=S.edit;if(!e||!e.id)return;
  var btn=$('#btn-delete');
  if(!e.del){e.del=true;btn.textContent='Wirklich löschen?';return;}
  try{
    await idbDel('docs',e.id);
    await idbDel('files',e.id);
    if(S.blobUrls[e.id]){URL.revokeObjectURL(S.blobUrls[e.id]);delete S.blobUrls[e.id];}
    closeModal();toast('Gelöscht.');
  }catch(err){toast('Löschen fehlgeschlagen.');}
}

async function relearn(){
  var e=S.edit;if(!e||!e.id)return;
  var d=S.docs.find(function(x){return x.id===e.id;});if(!d)return;
  var btn=$('#btn-relearn');btn.disabled=true;btn.textContent='Wird gelesen …';
  try{
    var blob=await idbGet('files',d.id);if(!blob)throw new Error('kein Blob');
    var f=new File([blob],d.name,{type:d.mime});
    var content=await extractContent(f,function(s){btn.textContent=s;});
    var meta=buildMeta(f,content.text||'');
    var upd=Object.assign({},d,meta,{pruefen:meta.pruefen});
    await idbPut('docs',upd);
    closeModal();toast('Neu einsortiert: '+meta.k+' › '+meta.u);
  }catch(err){btn.disabled=false;btn.textContent='Neu lesen';toast('Fehlgeschlagen.');}
}

/* ============ ZIPPEN ============ */
function safe(s){return String(s||'').replace(/[\\\/:*?"<>|\u0000-\u001f]/g,'').replace(/\s+/g,' ').trim().slice(0,80);}
async function exportZip(){
  if(!S.docs.length)return;
  if(!window.JSZip){toast('ZIP-Werkzeug fehlt.');return;}
  var btn=$('#btn-export'),lab=$('span',btn);btn.disabled=true;
  var zip=new window.JSZip(),used={},fail=0;
  for(var i=0;i<S.docs.length;i++){
    var d=S.docs[i];lab.textContent=(i+1)+'/'+S.docs.length;
    try{
      var blob=await idbGet('files',d.id);if(!blob)throw new Error('kein Blob');
      var base=safe(catOf(d))+'/'+safe(subOf(d))+'/'+(validIso(d.datum)?d.datum+' ':'')+(safe(d.titel)||'Dokument');
      var ext=extOf(d.name),p=base+(ext?'.'+ext:''),n=2;
      while(used[p.toLowerCase()]){p=base+' ('+n+')'+(ext?'.'+ext:'');n++;}
      used[p.toLowerCase()]=1;
      zip.file(p,blob);
    }catch(e){fail++;}
  }
  try{
    var out=await zip.generateAsync({type:'blob'});
    var url=URL.createObjectURL(out);
    var a=document.createElement('a');a.href=url;a.download='Aktenschrank '+today()+'.zip';a.click();
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    toast(fail?'ZIP gesichert. '+plural(fail,'Datei fehlt','Dateien fehlen')+'.':'ZIP gesichert.');
  }catch(e){toast('ZIP fehlgeschlagen.');}
  lab.textContent='ZIP';btn.disabled=false;
}

/* ============ EVENTS ============ */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;
  if(a==='pick'){$('#file').click();}
  else if(a==='shoot'){$('#cam').click();}
  else if(a==='open-cat'){S.q='';$('#q').value='';go(t.dataset.cat);}
  else if(a==='home'){go(null);}
  else if(a==='sub'){S.sub=t.dataset.sub||null;renderContent();}
  else if(a==='edit'){openEdit(t.dataset.id);}
  else if(a==='rename'){openRename(t.dataset.cat,t.dataset.sub);}
  else if(a==='close'){closeModal();}
  else if(a==='delete'){deleteDoc();}
  else if(a==='relearn'){relearn();}
  else if(a==='clearq'){S.queue=S.queue.filter(function(x){return x.state==='wartet'||x.state==='lesen';});renderQueue();}
  else if(a==='export'){exportZip();}
  else if(a==='ok'){var d=S.docs.find(function(x){return x.id===t.dataset.id;});if(d){var u=Object.assign({},d,{pruefen:false});idbPut('docs',u).catch(function(){toast('Fehler');});}}
  else if(a==='done'){var d2=S.docs.find(function(x){return x.id===t.dataset.id;});if(d2){var u2=Object.assign({},d2,{frist:''});idbPut('docs',u2).catch(function(){toast('Fehler');});}}
});
document.addEventListener('submit',function(ev){
  if(ev.target.id==='edit-form'){ev.preventDefault();saveEdit();}
  else if(ev.target.id==='rename-form'){ev.preventDefault();saveRename();}
});
document.addEventListener('change',function(ev){
  if(ev.target.name==='k'){var dl=$('#dl-u');if(dl)dl.innerHTML=subListHtml(ev.target.value);}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!$('#modal').hidden)closeModal();});
$('#q').addEventListener('input',function(ev){var was=!!S.q.trim();S.q=ev.target.value;if(!!S.q.trim()!==was)S.enter=true;renderContent();});
$('#file').addEventListener('change',function(ev){enqueue(ev.target.files);ev.target.value='';});
$('#cam').addEventListener('change',function(ev){enqueue(ev.target.files);ev.target.value='';});
var ein=$('#eingang');
['dragenter','dragover'].forEach(function(n){ein.addEventListener(n,function(ev){ev.preventDefault();ein.classList.add('drag');});});
['dragleave','drop'].forEach(function(n){ein.addEventListener(n,function(ev){ev.preventDefault();ein.classList.remove('drag');});});
ein.addEventListener('drop',function(ev){if(ev.dataTransfer&&ev.dataTransfer.files)enqueue(ev.dataTransfer.files);});
window.addEventListener('dragover',function(ev){ev.preventDefault();});
window.addEventListener('drop',function(ev){ev.preventDefault();});

/* ============ START ============ */
$('#stamp-date').textContent=fmtDate(today());
render();
(async function boot(){
  try{await idbOpen();}catch(e){toast('Datenbank nicht verfügbar.');}
  var all=await idbAll('docs');
  S.docs=all.filter(function(d){return d.type==='doc'&&d.id;});
  await refreshBlobUrls();
  S.ready=true;
  render();
  // Service Worker registrieren
  if('serviceWorker' in navigator){
    try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
  }
})();

// Live-Update via Events
setInterval(function(){/* Keep-Alive */},60000);

// Wenn DB ändert (über andere Tabs), neu laden
window.addEventListener('storage',async function(){var all=await idbAll('docs');S.docs=all.filter(function(d){return d.type==='doc'&&d.id;});await refreshBlobUrls();render();});
})();
</script>
